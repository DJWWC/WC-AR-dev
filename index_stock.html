<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Carpet AR — Stock Library</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root { --card:#111318; --stroke:#22252c; --bg:#0b0c10; --text:#e5e7eb; --muted:#94a3b8; }
    *{box-sizing:border-box}
    body { margin:0; font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }

    header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--stroke); }
    .bar { max-width:1024px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .logo { width:36px; height:36px; border-radius:999px; background:#0a0b0f; display:grid; place-items:center; }
    .logo img { width:28px; height:28px; display:block; }
    .titles { display:flex; flex-direction:column; line-height:1.2; }
    .title { font-weight:600; }
    .subtitle { font-weight:400; font-size:.9em; color:#cbd5e1; }
    .cta { padding:10px 14px; border-radius:10px; border:1px solid #334155; background:#1f2937; color:var(--text); cursor:pointer; white-space:nowrap; }

    main { max-width:1024px; margin:0 auto; padding:16px; display:grid; gap:16px; }
    .panel { background:var(--card); border:1px solid var(--stroke); border-radius:14px; padding:16px; }
    .row { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); }
    label { display:block; font-size:14px; margin:8px 0 6px; color:#cbd5e1 }
    select, input[type="number"] { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2f39; background:#0f1116; color:var(--text) }
    button { padding:10px 14px; border-radius:10px; border:1px solid #334155; background:#1f2937; color:var(--text); cursor:pointer }
    #status { color:var(--muted); font-size:12px; margin-top:8px }

    model-viewer { width:100%; height:60vh; border-radius:14px; border:1px solid var(--stroke); background:#0a0b0f; position:relative; }
    model-viewer [slot="ar-button"] {
      position:absolute; top:12px; right:12px; left:auto; bottom:auto;
      padding:10px 14px; border-radius:10px; border:1px solid #334155; background:#1f2937; color:var(--text);
    }

    @media (max-width:560px){
      .title { font-size:14px; }
      .subtitle { font-size:12px; }
      .cta { padding:8px 12px; font-size:14px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <div class="logo"><img src="./logo.png" alt="Company logo"></div>
        <div class="titles">
          <div class="title">Wilton Carpets AR (Demo)</div>
          <div class="subtitle">Tufted Stock Library</div>
        </div>
      </div>
      <button class="cta" id="arTopBtn">View in AR</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="row">
        <div>
          <label>Room width (m)</label>
          <input id="w" type="number" step="0.1" min="0.5" value="4">
        </div>
        <div>
          <label>Room length (m)</label>
          <input id="h" type="number" step="0.1" min="0.5" value="6">
        </div>
        <div>
          <label>Rotate (deg)</label>
          <input id="rot" type="number" step="1" value="0">
        </div>

        <div>
          <label>Choose a carpet</label>
          <select id="design">
            <option disabled selected>Loading designs…</option>
          </select>
        </div>

        <div>
          <label>Lighting</label>
          <select id="lighting">
            <option value="natural" selected>Natural</option>
            <option value="bulb">Bulb (warm)</option>
            <option value="dark">Dark</option>
          </select>
        </div>

        <div>
          <label>Pattern</label>
          <select id="mode">
            <option value="fill" selected>Tile across whole floor</option>
            <option value="single">Single tile (actual size)</option>
          </select>
        </div>

        <div>
          <label>Tile width (mm)</label>
          <input id="tileMm" type="number" step="10" min="50" value="1000">
        </div>

        <div style="align-self:end;">
          <button id="apply">Apply size + tiling</button>
        </div>
      </div>
      <div id="status">Please select a carpet from the dropdown.</div>
      <div id="scaleInfo" style="color:#94a3b8;font-size:12px;margin-top:4px"></div>
      <div id="caps" style="color:#94a3b8;font-size:12px;margin-top:4px"></div>
    </div>

    <model-viewer
      id="mv"
      src="./rug_plane_blank.glb"
      ar
      ar-scale="fixed"
      ar-modes="scene-viewer quick-look webxr"
      ar-placement="floor"
      camera-controls
      disable-zoom
      exposure="1"
      environment-image="neutral"
      shadow-intensity="0">
      <button slot="ar-button">View in AR</button>
    </model-viewer>

  </main>

<script type="module">
  const STOCK = [
    {name:'Berwick Whitsome',      url:'./Textures/Berwick_Whitsome.jpg'},
    {name:'Chesil Ammonite',       url:'./Textures/Chesil_Ammonite.jpg'},
    {name:'Chesil Barnacle',       url:'./Textures/Chesil_Barnacle.jpg'},
    {name:'Chesil Coral',          url:'./Textures/Chesil_Coral.jpg'},
    {name:'Chesil Driftwood',      url:'./Textures/Chesil_Driftwood.jpg'},
    {name:'Chesil Dune',           url:'./Textures/Chesil_Dune.jpg'},
    {name:'Chesil Gull',           url:'./Textures/Chesil_Gull.jpg'},
    {name:'Chesil Pebble',         url:'./Textures/Chesil_Pebble.jpg'},
    {name:'Chesil Seaweed',        url:'./Textures/Chesil_Seaweed.jpg'},
    {name:'Heritage Bath',         url:'./Textures/Heritage_Bath.jpg'},
    {name:'Heritage Blaise',       url:'./Textures/Heritage_Blaise.jpg'},
    {name:'Heritage Castlebourne', url:'./Textures/Heritage_Castlebourne.jpg'},
    {name:'Heritage Dinton',       url:'./Textures/Heritage_Dinton.jpg'},
    {name:'Heritage Greystroke',   url:'./Textures/Heritage_Greystroke.jpg'},
    {name:'Heritage Midford',      url:'./Textures/Heritage_Midford.jpg'},
    {name:'Heritage Watchfield',   url:'./Textures/Heritage_Watchfield.jpg'},
    {name:'Heritage Wyke',         url:'./Textures/Heritage_Wyke.jpg'},
    {name:'Test Carpet 1',         url:'./Textures/test_carpet1.jpg'},
  ];

  // DOM refs
  const mv  = document.getElementById('mv');
  const w   = document.getElementById('w');
  const h   = document.getElementById('h');
  const rot = document.getElementById('rot');
  const designSel   = document.getElementById('design');
  const lightingSel = document.getElementById('lighting');
  const applyBtn    = document.getElementById('apply');
  const status      = document.getElementById('status');
  const arTopBtn    = document.getElementById('arTopBtn');
  const capsEl      = document.getElementById('caps');
  const modeSel     = document.getElementById('mode');
  const tileMm      = document.getElementById('tileMm');
  const scaleInfo   = document.getElementById('scaleInfo');

  // Absolute GLB to feed Scene Viewer (native AR) every time we launch AR
  const ABS_GLB = new URL("rug_plane_blank.glb", location.href).href;

  // (Optional) capability hint
  (async () => {
    const gl2 = document.createElement('canvas').getContext('webgl2', { xrCompatible:true });
    const xr = 'xr' in navigator;
    let ar = false;
    try { ar = xr && await navigator.xr.isSessionSupported('immersive-ar'); } catch {}
    const badge = (t,ok)=>`<span style="padding:2px 6px;border:1px solid #2a2f39;border-radius:8px;margin-right:6px;${ok?'':'opacity:.55'}">${t}${ok?' ✅':' ❌'}</span>`;
    capsEl.innerHTML = badge('WebGL2', !!gl2) + badge('WebXR', xr) + badge('AR', ar) + ' — Native AR preferred for occlusion';
  })();

  // State
  let mat = null;
  let bakedKey = null;
  let TILE_URL = null;   // start with no texture
  let lastBakedURL = null; // remember last baked preview texture (data URL)

  function populateDropdown() {
    if (!designSel) return;
    designSel.innerHTML = '';
    const ph = document.createElement('option');
    ph.value = '';
    ph.textContent = '-- Select Design --';
    ph.disabled = true;
    ph.selected = true;
    designSel.appendChild(ph);
    STOCK.forEach((d) => {
      const opt = document.createElement('option');
      opt.value = d.url;
      opt.textContent = d.name;
      designSel.appendChild(opt);
    });
  }

  function clamp(n, a=0.5, b=100) { n = Number(n)||0; return Math.min(b, Math.max(a, n)); }
  function clampMm(n) { n = Number(n)||1000; return Math.min(20000, Math.max(50, n)); }

  // Tufts are square, so tile height follows from the image's pixel aspect.
  let tileAspect = 1; // tile height / tile width
  function tileSizeM() { const wM = clampMm(tileMm.value)/1000; return { wM, hM: wM*tileAspect }; }

  function applySizeRot() {
    const deg = Number(rot.value)||0;
    let W, H;
    if (modeSel.value === 'single') { const t = tileSizeM(); W = t.wM; H = t.hM; }
    else { W = clamp(w.value); H = clamp(h.value); }
    mv.scale = `${W} 0.001 ${H}`;
    mv.orientation = `0 ${deg*Math.PI/180} 0`;
  }

  async function fetchImage(url) {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
    const blob = await res.blob();
    const obj = URL.createObjectURL(blob);
    const img = new Image();
    img.src = obj;
    await img.decode();
    return { img, revoke: () => URL.revokeObjectURL(obj) };
  }

  // Returns a drawable at <= maxSide, tagged with origW (the source image's pixel width).
  async function prepareTile(url, maxSide=2048) {
    const { img, revoke } = await fetchImage(url);
    try {
      const w0 = img.width, h0 = img.height;
      const s = Math.min(1, maxSide / Math.max(w0, h0));
      const W = Math.max(2, Math.round(w0*s)), H = Math.max(2, Math.round(h0*s));
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      c.getContext('2d').drawImage(img, 0, 0, W, H);
      c.origW = w0;
      return c;
    } finally { revoke(); }
  }

  // Bake the floor texture at true physical scale.
  //   single: canvas = one tile, plane is scaled to the tile's real size.
  //   fill:   canvas = whole floor, tile repeated at its real size (no whole-metre rounding).
  async function bakeTexture(tileURL, mode, roomW, roomH, tileWm, lighting='natural') {
    const MAX = 4096;
    const tile = await prepareTile(tileURL, 2048);
    tileAspect = tile.height / tile.width;
    const tileHm = tileWm * tileAspect;
    const floorW = mode === 'single' ? tileWm : roomW;
    const floorH = mode === 'single' ? tileHm : roomH;
    const nativePpm = tile.width / tileWm;                  // texture px per metre at full resolution
    const ppm = Math.min(nativePpm, MAX / Math.max(floorW, floorH));
    const outW = Math.max(8, Math.round(floorW * ppm));
    const outH = Math.max(8, Math.round(floorH * ppm));

    const c = document.createElement('canvas'); c.width = outW; c.height = outH;
    const ctx = c.getContext('2d');
    switch (lighting) {
      case 'bulb': ctx.filter = 'brightness(1.05) saturate(1.08) sepia(0.08) hue-rotate(5deg)'; break;
      case 'dark': ctx.filter = 'brightness(0.85) contrast(0.95) saturate(0.95)'; break;
      default:     ctx.filter = 'none';
    }
    const sx = tileWm * ppm / tile.width, sy = tileHm * ppm / tile.height;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
    if (mode === 'single') ctx.drawImage(tile, 0, 0);
    else { ctx.fillStyle = ctx.createPattern(tile, 'repeat'); ctx.fillRect(0, 0, outW / sx, outH / sy); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.filter = 'none';
    return { url: c.toDataURL('image/jpeg', 0.92), origW: tile.origW, tileWm, tileHm };
  }

  async function ensureBakedAndApply() {
    if (!mat) return;
    if (!TILE_URL) {
      status.textContent = 'Please select a carpet from the dropdown.';
      return;
    }

    const mode = modeSel.value;
    const Wm = clamp(w.value), Hm = clamp(h.value);
    const tileWm = clampMm(tileMm.value) / 1000;
    const lighting = (lightingSel?.value) || 'natural';
    const key = `${mode}:${Wm}x${Hm}:T=${tileWm}:${TILE_URL}:L=${lighting}`;
    if (bakedKey === key) return;

    status.textContent = 'Baking texture…';
    try {
      const r = await bakeTexture(TILE_URL, mode, Wm, Hm, tileWm, lighting);
      const tex = await mv.createTexture(r.url);
      mat.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
      applySizeRot();
      bakedKey = key;
      lastBakedURL = r.url;
      const mmPx = (r.tileWm * 1000 / r.origW).toFixed(2);
      scaleInfo.textContent = `Tile = ${(r.tileWm*1000).toFixed(0)} × ${(r.tileHm*1000).toFixed(0)} mm · 1 source pixel = ${mmPx} mm (tuft ≈ 3–4 mm)`;
      status.textContent = 'Texture applied ✅';
    } catch (e) {
      console.error('Bake/apply failed:', e);
      status.textContent = '❌ Failed to apply texture.';
    }
  }

  // Restore the preview’s baked texture after returning from native AR
  async function restoreRuntimeTexture() {
    if (lastBakedURL && mat) {
      try {
        const tex = await mv.createTexture(lastBakedURL);
        mat.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
        status.textContent = 'Texture restored in preview.';
      } catch (e) { console.warn('Restore texture failed:', e); }
    }
  }

  // Always launch native AR on Android (Scene Viewer intent).
// Keep the baked texture in the page preview; native AR loads the GLB by URL.
async function launchNativeAR() {
  const isAndroid = /Android/i.test(navigator.userAgent);

  // Make sure <model-viewer> points to an absolute HTTPS model for native AR.
  // (Doesn't remove your baked preview texture anymore.)
  mv.setAttribute('ar-modes', 'scene-viewer quick-look webxr');

  if (isAndroid) {
    // Open Scene Viewer directly via intent (most reliable path to native AR + occlusion)
    const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(ABS_GLB)}&mode=ar_only&resizable=false#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end;`;
    window.location.href = intent;
    return;
  }

  // Non-Android (e.g., iOS with Quick Look) falls back to model-viewer's AR
  try {
    await mv.activateAR();
  } catch (e) {
    console.warn('activateAR failed:', e);
    status.textContent = '❌ AR failed to start.';
  }
}

  mv.addEventListener('load', () => {
    mat = mv.model?.materials?.find(m => m.name === 'RugMat') || mv.model?.materials?.[0];
    applySizeRot();
    if (mat) ensureBakedAndApply();
  });

  applyBtn.addEventListener('click', async () => {
    applySizeRot();
    if (!TILE_URL && designSel && designSel.value) TILE_URL = designSel.value;
    bakedKey = null;
    await ensureBakedAndApply();
  });

  designSel.addEventListener('change', async (e) => {
    TILE_URL = e.target.value || null;
    bakedKey = null;
    await ensureBakedAndApply();
  });

  function onModeOrTile() {
    w.disabled = h.disabled = modeSel.value === 'single';
    bakedKey = null;
    applySizeRot();
    return ensureBakedAndApply();
  }
  modeSel.addEventListener('change', onModeOrTile);
  tileMm.addEventListener('change', onModeOrTile);

  lightingSel.addEventListener('change', async () => {
    bakedKey = null;
    await ensureBakedAndApply();
  });

 // Intercept both AR buttons to force native AR path
const arSlotBtn = mv.querySelector('[slot="ar-button"]');
if (arSlotBtn) {
  arSlotBtn.addEventListener('click', (e) => { e.preventDefault(); launchNativeAR(); });
}
if (arTopBtn) {
  arTopBtn.addEventListener('click', () => { launchNativeAR(); });
}

mv.addEventListener('ar-status', (ev) => {
  console.log('[AR status]', ev.detail.status, 'mode =', mv.arMode);
  if (ev.detail.status === 'session-started') {
    status.textContent = (mv.arMode === 'scene-viewer' || mv.arMode === 'quick-look')
      ? 'AR via native viewer. Occlusion handled by device.'
      : 'AR via WebXR (in page).';
  }
});

  populateDropdown();
  TILE_URL = null;
  status.textContent = 'Please select a carpet from the dropdown.';
</script>

</body>
</html>
